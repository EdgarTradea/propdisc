name: Prop Firm Promo Tracker

on:
  schedule:
    # Runs every 3 hours. Adjust cron if needed.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need this to commit state.json updates

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Orchestrator
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m execution.orchestrator

      - name: Commit state.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json || echo "No state.json created yet"
          # Commit will fail if nothing changed, which is fine, we ignore error
          git commit -m "chore: update state.json with new tweet IDs [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push"
